    fields:
    - name: name
      label: Name
      type: string
    - name: note
      label: Short note
      type: text
    - name: url
      label: Link
      type: string
  - name: sites
    label: Websites
    type: object
    list:
      collapsible:
        collapsed: true
        summary: '{name}'
    fields:
    - name: name
      label: Name
      type: string
    - name: note
      label: Short note
      type: text
    - name: url
      label: Link
      type: string
  - name: handouts
    label: Handouts
